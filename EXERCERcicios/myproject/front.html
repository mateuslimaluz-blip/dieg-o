<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            background-color: #202020;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .calculadora {
            background-color: #000;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            width: 320px;
        }
        #display {
            width: 100%;
            height: 60px;
            background-color: #222;
            color: #fff;
            font-size: 24px;
            text-align: right;
            padding: 0 15px;
            border: none;
            border-radius: 5px;
            margin-bottom: 15px;
            outline: none;
        }
        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 20px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #333;
            color: #fff;
            transition: 0.2s;
        }
        button:hover {
            background-color: #444;
        }
        button.operador {
            background-color: #ff9500;
            color: #fff;
        }
        button.operador:hover {
            background-color: #e08500;
        }
        button.limpar {
            background-color: #d9534f;
        }
        button.limpar:hover {
            background-color: #c9302c;
        }
        button.zero {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <div class="calculadora">
        <input type="text" id="display" readonly>
        <div class="botoes">
            <button class="limpar" onclick="limparDisplay()">C</button>
            <button onclick="apagarUltimo()">DEL</button>
            <button class="operador" onclick="adicionarCaractere('/')">/</button>
            <button class="operador" onclick="adicionarCaractere('*')">*</button>
            
            <button onclick="adicionarCaractere('7')">7</button>
            <button onclick="adicionarCaractere('8')">8</button>
            <button onclick="adicionarCaractere('9')">9</button>
            <button class="operador" onclick="adicionarCaractere('-')">-</button>
            
            <button onclick="adicionarCaractere('4')">4</button>
            <button onclick="adicionarCaractere('5')">5</button>
            <button onclick="adicionarCaractere('6')">6</button>
            <button class="operador" onclick="adicionarCaractere('+')">+</button>
            
            <button onclick="adicionarCaractere('1')">1</button>
            <button onclick="adicionarCaractere('2')">2</button>
            <button onclick="adicionarCaractere('3')">3</button>
            <button class="operador" onclick="adicionarCaractere('.')">.</button>
            
            <button class="zero" onclick="adicionarCaractere('0')">0</button>
            <button class="operador" onclick="calcular()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function adicionarCaractere(caractere) {
            display.value += caractere;
        }

        function limparDisplay() {
            display.value = '';
        }

        function apagarUltimo() {
            display.value = display.value.slice(0, -1);
        }

        function calcular() {
            try {
                display.value = eval(display.value);
            } catch (erro) {
                display.value = 'Erro';
            }
        }
    </script>
</body>
</html>
